name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          PYTHONPATH=backend pytest -q backend/tests

      - name: Run evaluation set
        run: |
          PYTHONPATH=backend python backend/scripts/evaluate.py evaluation/eval_set.json > /tmp/eval-output.json
          python - <<'PY'
import json
from pathlib import Path
p = Path('/tmp/eval-output.json')
if not p.exists():
    raise SystemExit('missing evaluation output')
result = json.loads(p.read_text())
required = {
    'total_cases': 8,
    'retrieval_hit_at_k': 1.0,
    'citation_rate': 1.0,
    'grounding_decision_accuracy': 1.0,
    'language_match_rate': 1.0,
    'grounded_keyword_coverage': 1.0,
}
failed = {k: (result.get(k), v) for k, v in required.items() if result.get(k) != v}
if failed:
    print('Evaluation CI check failed:')
    for key, (actual, expected) in failed.items():
        print(f'  {key}: expected {expected}, got {actual}')
    raise SystemExit(1)
print('Strict evaluation metrics check passed.')
PY

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund

      - name: Build frontend
        run: |
          cd frontend
          npm run build
