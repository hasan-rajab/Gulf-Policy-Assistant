name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          PYTHONPATH=backend pytest -q backend/tests

      - name: Ingest sample policy corpus
        run: |
          PYTHONPATH=backend python backend/scripts/ingest_directory.py ./sample_data

      - name: Run evaluation set
        run: |
          PYTHONPATH=backend python backend/scripts/evaluate.py evaluation/eval_set.json > /tmp/eval-raw.txt
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('/tmp/eval-raw.txt')
          if not p.exists():
              raise SystemExit('missing evaluation output')

          lines = p.read_text().splitlines()
          try:
              start = next(i for i, line in enumerate(lines) if line.strip() == '{')
          except StopIteration:
              raise SystemExit('no top-level JSON object found in evaluation output')

          result = json.loads('\n'.join(lines[start:]))
          required = {
              'total_cases': 8,
              'retrieval_hit_at_k': 1.0,
              'citation_rate': 1.0,
              'grounding_decision_accuracy': 1.0,
              'language_match_rate': 1.0,
              'grounded_keyword_coverage': 1.0,
          }
          failed = {k: (result.get(k), v) for k, v in required.items() if result.get(k) != v}
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if failed:
              raise SystemExit(f'Evaluation CI check failed: {failed}')
          print('Strict evaluation metrics check passed.')
          PY

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund

      - name: Build frontend
        run: |
          cd frontend
          npm run build
