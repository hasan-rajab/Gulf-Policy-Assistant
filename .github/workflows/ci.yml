name: NEXUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend + RAG integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile backend sources
        run: PYTHONPATH=backend python -m compileall -q backend/app backend/scripts backend/tests

      - name: Run backend and security tests
        run: PYTHONPATH=backend pytest -q backend/tests

      - name: Ingest sample policy corpus
        run: PYTHONPATH=backend python backend/scripts/ingest_directory.py ./sample_data

      - name: Run strict evaluation set
        run: |
          PYTHONPATH=backend python backend/scripts/evaluate.py evaluation/eval_set.json > /tmp/eval-raw.txt
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('/tmp/eval-raw.txt')
          if not p.exists():
              raise SystemExit('missing evaluation output')

          lines = p.read_text().splitlines()
          try:
              start = next(i for i, line in enumerate(lines) if line.strip() == '{')
          except StopIteration:
              raise SystemExit('no top-level JSON object found in evaluation output')

          result = json.loads('\n'.join(lines[start:]))
          required = {
              'total_cases': 8,
              'retrieval_hit_at_k': 1.0,
              'citation_rate': 1.0,
              'citation_source_integrity_rate': 1.0,
              'grounding_decision_accuracy': 1.0,
              'language_match_rate': 1.0,
              'grounded_keyword_coverage': 1.0,
          }
          failed = {k: (result.get(k), v) for k, v in required.items() if result.get(k) != v}
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if failed:
              raise SystemExit(f'Evaluation CI check failed: {failed}')
          print('Strict NEXUS evaluation metrics check passed.')
          PY

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  infrastructure-validation:
    name: Compose + deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment script syntax
        run: bash -n infra/deploy.sh

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
