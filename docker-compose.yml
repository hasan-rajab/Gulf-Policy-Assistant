services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /app/data
      SAMPLE_DATA_DIR: /sample_data
    volumes:
      - rag_data:/app/data
      - ./sample_data:/sample_data:ro
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_APP_NAME: Gulf Horizon Policy Assistant
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  rag_data:
