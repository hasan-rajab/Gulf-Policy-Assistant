services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /app/data
      SAMPLE_DATA_DIR: /sample_data
    volumes:
      - nexus_data:/app/data
      - ./sample_data:/sample_data:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_APP_NAME: NEXUS Enterprise AI
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  nexus_data:
